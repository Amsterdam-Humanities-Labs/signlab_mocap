<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/userProtect.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motion Capture NGT Recordings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Load JavaScript files -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>

    <style>
        .verybigmodal {
            /* Fixed width and height */
            width: 80vw;
            max-width: 80vw;
            height: 80vh;
        }
        /* Ensure modal body stacks content vertically */
        .modal-body-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            height: 100%; /* Fill the modal body */
        }
        .iframe-container {
            /* Optional styling */
        }
        .videos-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        /* Ensure videos maintain aspect ratio */
        .videos-container video {
            width: 100%;
            height: 50%; /* Each video takes up half of the videos container */
            object-fit: cover; /* Adjust as needed: 'cover' or 'contain' */
        }
        /* Prevent modal content from resizing */
        .modal-content {
            height: 100%;
        }
        #metadata-video-element{
            min-height: 480px;
            /* clockwise 90 degrees */
            transform: rotate(90deg);
        }
        /* Spinner Modal Styles */
        /* Optional: Customize the spinner modal's appearance */
        #loadingModal .modal-content {
            background: transparent;
            border: none;
            box-shadow: none;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h2>Motion Capture NGT Recordings</h2>
        
        <!-- Search, Date Selection, and Sort Button -->
        <div class="row mb-4">
            <div class="col-md-5">
                <input type="text" id="search-input" class="form-control" placeholder="Search by Glos...">
            </div>
            <div class="col-md-3">
                <select id="date-select" class="form-select">
                    <option value="">Select Date</option>
                    <!-- Dates will be dynamically populated -->
                </select>
            </div>
            <div class="col-md-2">
                <button id="sort-button" class="btn btn-outline-secondary">Sort: Descending</button>
            </div>
            <div class="col-md-2">
                <button id="search-button" class="btn btn-primary">Search</button>
                <button id="clear-search-button" class="btn btn-secondary ms-2">Clear</button>
            </div>
        </div>

        <!-- Additional Counts -->
        <div class="row mb-4">
            <div class="col-md-12">
                <div class="alert alert-info" role="alert">
                    <strong>Total takes:</strong> <span id="count-all">0</span> |
                    <strong>Unique takes:</strong> <span id="count-take-0">0</span> |
                    <strong>LiveLink Metadata:</strong> <span id="count-ll-metadata">0</span> |
                    <strong>Vicon FBX:</strong> <span id="count-vicon-fbx">0</span> |
                    <strong>Vicon CSV:</strong> <span id="count-vicon-csv">0</span>
                </div>
            </div>
        </div>

        <!-- Spinner Within Rows (Removed) -->
        <!--
        <div id="spinner" class="spinner-container">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
        -->

        <div id="freemocap-list" class="list-group">
            <!-- Data will be dynamically loaded here -->
        </div>
        <button id="load-more" class="btn btn-primary mt-3">Load More</button>
    </div>
    
    <!-- Unified Modal -->
    <div class="modal fade" id="modelViewerModal" tabindex="-1" aria-labelledby="modelViewerModalLabel" aria-hidden="true">
        <div class="modal-dialog verybigmodal">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title text-center" id="modelViewerModalLabel">3D Model Viewer</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="modal-body-container">
                        <div class="row">
                            <div class="col-md-9 iframe-container">
                                <div id="viewer-iframe" style="width: 1500px; height: 1024px;"></div>
                            </div>
                            <div class="col-md-3 videos-container">
                                <video id="video-element" controls autoplay loop>
                                    <source src="" type="video/mp4">
                                    Your browser does not support the video tag.
                                </video>
                                <video id="metadata-video-element" controls autoplay loop>
                                    <source src="" type="video/mp4">
                                    Your browser does not support the video tag.
                                </video>
                            </div>
                        </div>
                        <!-- Download Buttons inside Modal -->
                        <div class="mt-3">
                            <a href="#" id="download-glb" class="btn btn-secondary ms-2 mt-2" download>Download GLB</a>
                            <a href="#" id="download-fbx" class="btn btn-secondary ms-2 mt-2" download>Download FBX</a>
                            <a href="#" id="download-csv" class="btn btn-secondary ms-2 mt-2" download>Download Blendshapes</a>
                            <a href="#" id="download-vicon-fbx" class="btn btn-secondary ms-2 mt-2" download>Download Vicon FBX</a>
                            <a href="#" id="download-vicon-csv" class="btn btn-secondary ms-2 mt-2" download>Download Vicon CSV</a>
                        </div>
                        <!-- Share URL -->
                        <div class="mt-3">
                            <input type="text" id="share-url" class="form-control" readonly>
                            <button id="copy-share-url" class="btn btn-outline-secondary mt-2">Copy Share URL</button>
                        </div>
                    </div>
                </div>
                <div class="modal-footer d-flex justify-content-center">
                    <button type="button" id="prev-btn" class="btn btn-secondary btn-lg">Previous</button>
                    <button type="button" id="next-btn" class="btn btn-secondary btn-lg ms-3">Next</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Spinner Modal -->
    <div class="modal fade" id="loadingModal" tabindex="-1" aria-labelledby="loadingModalLabel" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-body text-center">
                    <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-3">Loading, please wait...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentPage = 1;
        const limit = 10;
        let itemsList = []; // Array to store all loaded items
        let currentIndex = -1; // Index of the currently viewed item in the modal
        let isLoading = false; // Flag to prevent multiple simultaneous loads
        let currentSearch = ''; // Current search parameter
        let selectedDate = ''; // Selected date parameter
        let totalPages = 1; // Total number of pages, will be updated on data load
        let currentSort = 'DESC'; // Current sort order

        /**
         * Function to show the spinner modal
         */
        function showSpinner() {
            // const loadingModal = new bootstrap.Modal(document.getElementById('loadingModal'), {
            //     backdrop: 'static',
            //     keyboard: false
            // });
            // loadingModal.show();
            // // Store the modal instance globally to hide it later
            // window.loadingModalInstance = loadingModal;
        }

        /**
         * Function to hide the spinner modal with a 1-second delay
         */
        function hideSpinner() {
            if (window.loadingModalInstance) {
                // Introduce a 1-second delay before hiding
                setTimeout(() => {
                    window.loadingModalInstance.hide();
                }, 1000);
            }
        }

        /**
         * Function to load distinct dates for the date select menu
         */
        function loadDates() {
            return new Promise((resolve, reject) => {
                $.ajax({
                    url: 'https://signcollect.nl/mocap/getRecords.php',
                    type: 'GET',
                    data: {
                        action: 'get_dates'
                    },
                    dataType: 'json',
                    success: function(response) {
                        if (response.success) {
                            const dateSelect = $('#date-select');
                            response.dates.forEach(date => {
                                dateSelect.append(`<option value="${date}">${date}</option>`);
                            });
                            resolve();
                        } else {
                            console.error('Error fetching dates:', response.error);
                            reject(response.error);
                        }
                    },
                    error: function(error) {
                        console.error('Error fetching dates:', error);
                        reject(error);
                    }
                });
            });
        }

        /**
         * Function to get URL parameters
         */
        function getUrlParameter(name) {
            name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
            const regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
            const results = regex.exec(window.location.search);
            return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
        }

        /**
         * Function to load Freemocap data from the endpoint with optional search, date filters, and sort order.
         * @param {number} page - The current page number.
         * @param {string} search - The search parameter.
         * @param {string} date - The date parameter.
         * @param {string} sort - The sort order ('ASC' or 'DESC').
         * @returns {Promise} - Resolves when data is loaded.
         */
        function loadFreemocapData(page, search = '', date = '', sort = 'DESC') {
            isLoading = true;
            showSpinner();
            return new Promise((resolve, reject) => {
                $.ajax({
                    url: 'https://signcollect.nl/mocap/getRecords.php',
                    type: 'GET',
                    data: {
                        action: 'fetch_records',
                        page: page,
                        limit: limit,
                        searchparam: search,
                        date: date,
                        sort: sort
                    },
                    dataType: 'json',
                    success: function(response) {
                        hideSpinner();
                        // Check if the response is successful
                        if (!response.success) {
                            console.error('Error from server:', response.error);
                            alert('Failed to load data.');
                            isLoading = false;
                            return reject(response.error);
                        }

                        const list = $('#freemocap-list');
                        const data = response.data;
                        const pagination = response.pagination;
                        const counts = response.counts;
                        
                        // Update counts in the frontend only if counts are provided
                            $('#count-all').text(counts.count_all); // Corrected to count_all
                        
                            $('#count-take-0').text(counts.unique_glos_count);
                            $('#count-ll-metadata').text(counts.count_ll_metadata);
                            $('#count-vicon-fbx').text(counts.count_vicon_fbx);
                        
                            $('#count-vicon-csv').text(counts.count_vicon_csv);
                        

                        // Update totalPages if provided
                        if (pagination.total_pages) {
                            totalPages = pagination.total_pages;
                        }

                        // If it's the first page or a new search/date filter, clear the list and itemsList
                        if (page === 1) {
                            list.empty();
                            itemsList = [];
                        }

                        data.forEach(function(item) {
                            // Add item to the itemsList array
                            itemsList.push({
                                id: item.file_id,
                                glos: item.glos,
                                glbPath: `https://signcollect.nl/gebarenoverleg_media/fbx/${item.filename}`,
                                fbxPath: `https://signcollect.nl/gebarenoverleg_media/fbx/${item.filename.replace('.glb', '.fbx')}`,
                                csvPath: `https://signcollect.nl/gebarenoverleg_media/csv/${item.ll_metadata ? item.ll_metadata.replace('.json', '.csv') : ''}`,
                                viconPath: `https://signcollect.nl/gebarenoverleg_media/mocap/${item.filename.replace('.glb', '.mocap')}`, // Adjust extension if different
                                viewerUrl: `https://signcollect.nl/jari/BabylonSignLab/LoadingAnimation/main.html?externalAnim=${encodeURIComponent(`https://signcollect.nl/gebarenoverleg_media/fbx/${item.filename}`)}&cameraAngle=90&mesh=${encodeURIComponent('https://signcollect.nl/jari/BabylonSignLab/LoadingAnimation/MeshesAndAnims/glassesGuyNew.glb')}&noExtraButtons=1`,
                                videoUrl: item.video_url, // Ensure this field exists in the JSON
                                metadataMp4Url: item.ll_metadata ? `https://signcollect.nl/gebarenoverleg_media/llVideos/${item.ll_metadata.replace('.json', '.mp4')}` : '', // Derived MP4 URL
                                vicon_csv: item.vicon_csv ? item.vicon_csv.replace('/web', '') : '',
                                vicon_fbx: item.vicon_fbx ? item.vicon_fbx.replace('/web', '') : ''
                            });

                            // Create the list item with download buttons and share URL
                            const listItem = `
                                <div class='list-group-item' id='item-${item.file_id}'>
                                    <h5 class='mb-1'>Glos: ${item.glos}</h5>
                                    <p class='mb-1'>Take: ${item.take}</p>
                                    <p class='mb-1'>Datetime: ${item.datetime}</p>
                                    <p class='mb-1'>Avatar Name: ${item.avatarName}</p>
                                    <button class='btn btn-primary view-model mt-2' data-id='${item.file_id}'>View 3D Model</button>
                                    <a href='${`https://signcollect.nl/gebarenoverleg_media/fbx/${item.filename}`}' class='btn btn-secondary ms-2 mt-2' download>Download GLB</a>
                                    <a href='${`https://signcollect.nl/gebarenoverleg_media/fbx/${item.filename.replace('.glb', '.fbx')}`}' class='btn btn-secondary ms-2 mt-2' download>Download FBX</a>
                                    <a href='${`https://signcollect.nl/gebarenoverleg_media/csv/${item.ll_metadata ? item.ll_metadata.replace('.json', '.csv') : ''}`}' class='btn btn-secondary ms-2 mt-2' download>Download Blendshapes</a>
                                    <a href='${item.vicon_fbx}' class='btn btn-secondary ms-2 mt-2' download>Download Vicon FBX</a>
                                    <a href='${item.vicon_csv}' class='btn btn-secondary ms-2 mt-2' download>Download Vicon CSV</a>
                                    <div class="mt-2">
                                        <input type="text" class="form-control mb-2" value="${window.location.origin + window.location.pathname}?glos=${encodeURIComponent(item.glos)}" readonly>
                                        <button class='btn btn-outline-secondary copy-share-url' data-glos='${encodeURIComponent(item.glos)}'>Copy Share URL</button>
                                    </div>
                                </div>
                            `;

                            list.append(listItem);
                        });

                        // Handle "Load More" button visibility based on pagination
                        if (page >= totalPages) {
                            $('#load-more').hide();
                        } else {
                            $('#load-more').show();
                        }

                        isLoading = false;
                        resolve(data.length > 0);
                    },
                    error: function(error) {
                        hideSpinner();
                        console.error('Error fetching data:', error);
                        isLoading = false;
                        reject(error);
                    }
                });
            }); // Added closing parenthesis for the Promise
        } // Existing closing brace for the function

        $(document).ready(function() {
            // Initialize Bootstrap modals
            const modelViewerModal = new bootstrap.Modal(document.getElementById('modelViewerModal'), {
                keyboard: false
            });
            const loadingModal = new bootstrap.Modal(document.getElementById('loadingModal'), {
                backdrop: 'static',
                keyboard: false
            });

            // Load available dates
            loadDates().then(() => {
                // After loading dates, proceed to load data
                handleInitialLoad();
            }).catch(error => {
                console.error('Failed to load dates:', error);
            });

            // Function to handle initial load based on URL parameters
            function handleInitialLoad() {
                const glosParam = getUrlParameter('glos');
                if (glosParam) {
                    // If glos parameter exists, load the specific record
                    currentSearch = glosParam;
                    currentPage = 1;
                    // Clear date selection
                    $('#date-select').val('');
                    loadFreemocapData(currentPage, currentSearch, '', currentSort).then(hasMore => {
                        if (hasMore && itemsList.length > 0) {
                            currentIndex = 0;
                            const currentItem = itemsList[currentIndex];
                            openModalWithItem(currentItem);
                        } else {
                            alert('No records found for the specified Glos.');
                        }
                    }).catch(error => {
                        alert('Failed to load the specified record.');
                    });
                } else {
                    // If no glos parameter, load the first page of data
                    loadFreemocapData(currentPage, currentSearch, selectedDate, currentSort);
                }
            }

            // Sort Button Functionality
            $('#sort-button').on('click', function() {
                // Toggle sort order
                if (currentSort === 'DESC') {
                    currentSort = 'ASC';
                    $(this).text('Sort: Ascending');
                } else {
                    currentSort = 'DESC';
                    $(this).text('Sort: Descending');
                }
                // Reload data with new sort order
                currentPage = 1;
                loadFreemocapData(currentPage, currentSearch, selectedDate, currentSort);
            });

            // Load more data on button click
            $('#load-more').on('click', function() {
                if (!isLoading && currentPage < totalPages) {
                    currentPage++;
                    loadFreemocapData(currentPage, currentSearch, selectedDate, currentSort);
                }
            });

            // Handle the modal display for 3D models
            $(document).on('click', '.view-model', function() {
                const id = $(this).data('id');
                console.log('Clicked ID:', id);
                // Find the index of the item in itemsList
                currentIndex = itemsList.findIndex(item => String(item.id) === String(id));
                console.log('Items List:', itemsList);

                if (currentIndex !== -1) {
                    console.log('Current index:', currentIndex);    
                    const currentItem = itemsList[currentIndex];
                    openModalWithItem(currentItem);
                } else {
                    console.error('Item not found in itemsList');
                }
            });

            // Function to open modal with a specific item
            function openModalWithItem(item) {
                // Update modal title with glos
                $('#modelViewerModalLabel').text(`${item.glos}`).css('text-align', 'center');
                // Update iframe src
                $('#viewer-iframe').html(`<iframe src="${item.viewerUrl}" style="width: 1500px; height: 1024px; border: none;"></iframe>`);
                
                // Update existing video src and autoplay
                $('#video-element').attr('src', item.videoUrl).get(0).play();
                // Update metadata MP4 video src and autoplay
                $('#metadata-video-element').attr('src', item.metadataMp4Url).get(0).play();
                // Update download links
                $('#download-glb').attr('href', item.glbPath);
                $('#download-fbx').attr('href', item.fbxPath);
                $('#download-csv').attr('href', item.csvPath);
                $('#download-vicon-fbx').attr('href', item.vicon_fbx);
                $('#download-vicon-csv').attr('href', item.vicon_csv);
                // Update share URL
                const shareUrl = `${window.location.origin + window.location.pathname}?glos=${encodeURIComponent(item.glos)}`;
                $('#share-url').val(shareUrl);
                // Show the modal
                modelViewerModal.show();
            }

            // Previous button functionality
            $('#prev-btn').on('click', function() {
                if (currentIndex > 0) {
                    currentIndex--;
                    const previousItem = itemsList[currentIndex];
                    openModalWithItem(previousItem);
                } else {
                    alert('This is the first item.');
                }
            });

            // Next button functionality
            $('#next-btn').on('click', function() {
                if (currentIndex < itemsList.length - 1) {
                    // Move to next item in the current list
                    currentIndex++;
                    const nextItem = itemsList[currentIndex];
                    openModalWithItem(nextItem);
                } else {
                    // At the end of the current list, check if more pages are available
                    if (!isLoading && currentPage < totalPages) {
                        // Load next page
                        currentPage++;
                        loadFreemocapData(currentPage, currentSearch, selectedDate, currentSort).then(hasMore => {
                            if (hasMore) {
                                // After loading, move to the first item of the new page
                                currentIndex++;
                                const nextItem = itemsList[currentIndex];
                                if (nextItem) {
                                    openModalWithItem(nextItem);
                                } else {
                                    alert('No items found after loading more.');
                                }
                            } else {
                                // No more data to load
                                alert('No more items available.');
                                // Optionally, disable the Next button
                                $('#next-btn').prop('disabled', true);
                            }
                        }).catch(error => {
                            alert('Failed to load more items.');
                        });
                    } else {
                        // No more pages to load
                        alert('No more items available.');
                        // Optionally, disable the Next button
                        $('#next-btn').prop('disabled', true);
                    }
                }
            });

            // Clear the iframe and video sources when the modal is hidden to stop the 3D viewer and videos
            $('#modelViewerModal').on('hidden.bs.modal', function () {
                $('#viewer-iframe').html('');
                $('#video-element').attr('src', '').get(0).pause();
                $('#metadata-video-element').attr('src', '').get(0).pause();
                $('#share-url').val('');
            });

            // Search functionality
            $('#search-button').on('click', function() {
                const searchValue = $('#search-input').val().trim();
                if (searchValue !== '') {
                    currentSearch = searchValue;
                    currentPage = 1; // Reset to first page
                    selectedDate = ''; // Clear date selection
                    $('#date-select').val('');
                    loadFreemocapData(currentPage, currentSearch, '', currentSort);
                }
            });

            // Allow pressing Enter key to trigger search
            $('#search-input').on('keypress', function(e) {
                if (e.which === 13) { // Enter key
                    $('#search-button').click();
                }
            });

            // Clear search functionality
            $('#clear-search-button').on('click', function() {
                $('#search-input').val('');
                currentSearch = '';
                currentPage = 1; // Reset to first page
                loadFreemocapData(currentPage, currentSearch, selectedDate, currentSort);
            });

            // Date selection functionality
            $('#date-select').on('change', function() {
                selectedDate = $(this).val();
                if (selectedDate !== '') {
                    currentSearch = ''; // Clear search
                    $('#search-input').val('');
                }
                currentPage = 1; // Reset to first page
                loadFreemocapData(currentPage, currentSearch, selectedDate, currentSort);
            });

            // Copy share URL functionality
            $(document).on('click', '.copy-share-url, #copy-share-url', function() {
                const shareUrl = $('#share-url').val();
                if (shareUrl) {
                    navigator.clipboard.writeText(shareUrl).then(() => {
                        alert('Share URL copied to clipboard!');
                    }).catch(err => {
                        console.error('Could not copy text: ', err);
                    });
                }
            });
        });
        </script>
        
    </body>
</html>
